<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dragon Survivors: art preview</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 16px; background: #0b0d10; color: #d8dde3; font: 14px/1.4 ui-monospace, Consolas, monospace; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 18px; margin: 0 12px 0 0; }
    input[type=search] { background: #15191e; color: inherit; border: 1px solid #333a42; padding: 4px 8px; font: inherit; width: 16em; }
    label { user-select: none; }
    h2 { font-size: 15px; margin: 20px 0 8px; color: #9fb3c8; border-bottom: 1px solid #252b32; }
    .group { display: flex; flex-wrap: wrap; gap: 12px; }
    .card { background: #13171c; border: 1px solid #252b32; padding: 8px; }
    .card .name { font-weight: bold; }
    .card .meta { color: #7d8a97; font-size: 12px; }
    .cells { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    .strip { margin-top: 6px; }
    .hidden { display: none; }
    #error { color: #ff7070; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>Art preview</h1>
    <input id="filter" type="search" placeholder="filter by name (e.g. icon.)" autofocus>
    <label><input id="frames" type="checkbox"> all frames</label>
    <label><input id="pause" type="checkbox"> pause</label>
    <span id="summary"></span>
  </header>
  <p class="meta">Every anim of <code>assets/atlas.json</code> at 2× (game scale), 3× (silver and gold tiers in game) and 4×, on grass and on black, playing at its own tick durations (60 Hz). Rebuild with <code>npm run build:assets</code> and reload.</p>
  <div id="error"></div>
  <main id="main"></main>
  <script type="module" src="art-preview.mjs"></script>
</body>
</html>
