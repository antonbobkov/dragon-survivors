<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10; --panel: #13171c; --line: #252b32; --text: #d8dde3; --dim: #7d8a97;
      --accent: #f0b429; --sel: #2a3340; --err: #ff7070; --warn: #e8c060;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, Consolas, monospace; }
    button, select, input { font: inherit; color: inherit; }
    button, select { background: #1b2027; border: 1px solid #333a42; padding: 3px 8px; cursor: pointer; }
    button:hover { border-color: #4a535e; }
    button.on { border-color: var(--accent); color: var(--accent); }
    input[type=search] { background: #15191e; border: 1px solid #333a42; padding: 4px 8px; width: 100%; }
    input[type=color] { width: 28px; height: 22px; padding: 0; border: 1px solid #333a42; background: none; vertical-align: middle; }
    label { user-select: none; white-space: nowrap; }
    .app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
    aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .src { padding: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
    .src h1 { font-size: 15px; margin: 0; }
    .src .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    #srcName { color: var(--dim); word-break: break-all; }
    #tree { overflow: auto; flex: 1; padding: 4px 0 16px; }
    details > summary { padding: 3px 10px; color: #9fb3c8; cursor: pointer; list-style: none; }
    details > summary::before { content: '▸ '; color: var(--dim); }
    details[open] > summary::before { content: '▾ '; }
    .item { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 2px 10px 2px 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item:hover { background: #181d23; }
    .item.sel { background: var(--sel); color: #fff; }
    main { overflow: auto; padding: 14px 18px 40px; min-width: 0; }
    .bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
    .group { display: flex; gap: 4px; align-items: center; }
    .group > span { color: var(--dim); margin-right: 2px; }
    #title { font-size: 16px; margin: 0 0 2px; }
    #meta { color: var(--dim); margin-bottom: 10px; }
    #warnings { color: var(--warn); white-space: pre-wrap; }
    #error { color: var(--err); white-space: pre-wrap; }
    .stage { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 16px; }
    .cell { display: grid; gap: 4px; justify-items: start; }
    .cell .cap { color: var(--dim); }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    h2 { font-size: 13px; color: #9fb3c8; margin: 18px 0 8px; font-weight: normal; border-bottom: 1px solid var(--line); }
    #sheet { display: flex; flex-wrap: wrap; gap: 8px; }
    .frame { display: grid; gap: 2px; justify-items: center; cursor: pointer; padding: 3px; border: 1px solid transparent; }
    .frame.cur { border-color: var(--accent); }
    .frame .cap { color: var(--dim); font-size: 11px; }
    #custom { display: none; gap: 10px; flex-wrap: wrap; align-items: center; padding: 8px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 12px; }
    #custom.show { display: flex; }
    .keys { color: var(--dim); font-size: 11px; margin-top: 24px; }
    .empty { color: var(--dim); padding: 40px 0; }
    @media (max-width: 720px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: 12px 16px 40px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="src">
      <h1>Pixel viewer</h1>
      <div class="row">
        <button id="gameBtn" title="The game's built atlas (assets/atlas.json)">Game sprites</button>
        <button id="packBtn" title="Every BMP of the original dragon game (pack/, from burn_n_turn)">Old game pack</button>
        <button id="folderBtn" title="Text art, pack frame lists, BMP and PNG files">Open folder…</button>
        <button id="reloadBtn" title="Read the source again (R)">Reload</button>
        <input id="folderInput" type="file" webkitdirectory multiple hidden>
      </div>
      <div id="srcName"></div>
      <input id="filter" type="search" placeholder="filter (name, folder, source)">
    </div>
    <div id="tree"></div>
  </aside>
  <main>
    <div class="bar">
      <div class="group"><span>scale</span><button id="scaleDown">−</button><b id="scaleVal">4×</b><button id="scaleUp">+</button><button id="scaleGame" title="The scale the game draws it at">game</button></div>
      <div class="group"><span>bg</span><select id="bg"><option value="grass">grass</option><option value="black">black</option><option value="checker">checker</option><option value="grey">grey</option><option value="white">white</option></select></div>
      <div class="group"><button id="playBtn">❚❚</button><button id="prevBtn" title="Previous frame (←)">◀</button><button id="nextBtn" title="Next frame (→)">▶</button>
        <select id="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
      <label><input id="flip" type="checkbox"> mirror</label>
      <div class="group" id="variants"><span>variant</span></div>
      <label><input id="compare" type="checkbox"> compare all</label>
    </div>
    <div id="custom">
      <label>swap <select id="swap"><option value="">none</option><option value="rg">r↔g</option><option value="rb">r↔b</option><option value="gb">g↔b</option></select></label>
      <label><input id="tintOn" type="checkbox"> tint <input id="tint" type="color" value="#c86428"></label>
      <label>strength <input id="strength" type="range" min="0.05" max="1" step="0.05" value="0.6"> <span id="strengthVal">0.6</span></label>
      <label><input id="outlineOn" type="checkbox"> outline <input id="outline" type="color" value="#d8702c"></label>
      <span id="opsText" style="color: var(--dim)"></span>
    </div>
    <div id="error"></div>
    <div id="view">
      <h2 id="title" style="border:0;margin:0 0 2px;color:var(--text);font-size:16px"></h2>
      <div id="meta"></div>
      <div id="warnings"></div>
      <div class="stage" id="stage"></div>
      <h2>Sheet: every frame, click to hold it</h2>
      <div id="sheet"></div>
    </div>
    <div class="keys">space play/pause · ← → frame · ↑ ↓ sprite · + − scale · m mirror · v variant · r reload</div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
