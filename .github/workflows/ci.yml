name: gate
on:
  push:
    branches: [main, 'gate/**', 'task/**']
  pull_request:
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs
      - run: node --test 'test/**/*.test.mjs'
